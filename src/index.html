<!doctype html>
<html lang="es" data-theme="dark" class="app-dark">
<head>
  <meta charset="utf-8">
  <title>Mi Ternerita House | Entradas y eventos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- SEO por defecto; SeoService lo ajusta en cada página (título, descripción, canónica, Open Graph, JSON-LD). -->
  <meta name="description" content="Entradas para conciertos, fiestas y eventos en Mi Ternerita House, Maracaibo. Compra desde tu móvil, paga con Pago Móvil o Zelle y recibe tu QR por correo.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta property="og:site_name" content="Mi Ternerita House">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_VE">
  <meta property="og:title" content="Mi Ternerita House | Entradas y eventos en Maracaibo">
  <meta property="og:description" content="Conciertos, fiestas y eventos en Mi Ternerita House. Compra tus entradas desde el móvil y recibe tu QR por correo.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0A0A0C">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="preload" href="assets/fonts/AlteHaasGroteskRegular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/AlteHaasGroteskBold.woff" as="font" type="font/woff" crossorigin>
  <script>
    // Aplica el tema guardado antes del primer pintado para evitar parpadeos.
    (function () {
      try {
        var theme = localStorage.getItem('tm-theme') === 'light' ? 'light' : 'dark';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.classList.toggle('app-dark', theme === 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
