<div class="confirm">
    <span class="icon"><i class="pi pi-trash"></i></span>
    <p class="message">{{ message }}</p>
    <p class="hint">Esta acción no se puede deshacer.</p>

    <div class="buttons">
        <button type="button" class="tm-btn tm-btn--ghost" (click)="cancel()">Cancelar</button>
        <button type="button" class="tm-btn danger" (click)="confirm()">Eliminar</button>
    </div>
</div>
