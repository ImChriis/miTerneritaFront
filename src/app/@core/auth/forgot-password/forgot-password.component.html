<div class="content">
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <div class="logo">
            <img class="loginImg" src="../../../assets/img/logo.png" alt="">
            <h1>Recuperar Contraseña</h1>
            <p>Ingresa tu correo electrónico para enviarte un codigo de recuperación</p>
        </div>

        <div class="inputGroup">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" formControlName="email">
        </div>

        <div class="btn">
            <button class="btnLogin" type="submit">Enviar</button>
        </div>

        <!-- <div class="links">
            <a routerLink="/forgotPassword">¿Olvidaste tu contraseña?</a>
            <p>¿No tienes una cuenta? <a (click)="register()">Regístrate</a></p>
        </div> -->
    </form>
</div>
