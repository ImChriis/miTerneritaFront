<section class="tm-auth tm-auth--narrow">
    <div class="tm-auth-panel">
        <header class="tm-auth-head">
            <span class="tm-auth-icon"><i class="pi pi-key"></i></span>
            <h1>Recuperar contraseña</h1>
            <p>Ingresa tu correo y te enviaremos un código para restablecerla.</p>
        </header>

        <form class="tm-form" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="tm-field">
                <label class="tm-label" for="email">Correo electrónico</label>
                <div class="tm-input-wrap">
                    <i class="pi pi-envelope"></i>
                    <input class="tm-input" type="email" id="email" formControlName="email" autocomplete="email" placeholder="tu@correo.com" />
                </div>
                @if (forgotPasswordForm.controls.email.touched && forgotPasswordForm.controls.email.invalid) {
                    <p class="tm-error">Ingresa un correo válido.</p>
                }
            </div>

            <button class="tm-btn tm-btn--primary tm-btn--lg tm-btn--block" type="submit" [disabled]="loading()">
                @if (loading()) {
                    <i class="pi pi-spin pi-spinner"></i> Enviando…
                } @else {
                    Enviar código
                }
            </button>
        </form>

        <p class="tm-auth-alt"><a routerLink="/login"><i class="pi pi-arrow-left"></i> Volver a iniciar sesión</a></p>
    </div>
</section>
