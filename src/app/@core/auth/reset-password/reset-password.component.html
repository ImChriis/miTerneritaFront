<form class="tm-form" [formGroup]="resertPasswordForm" (ngSubmit)="onSubmit()" novalidate>
    <p class="intro">Escribe el código que te enviamos por correo y tu nueva contraseña.</p>

    <div class="tm-field">
        <label class="tm-label" for="code">Código</label>
        <div class="tm-input-wrap">
            <i class="pi pi-hashtag"></i>
            <input class="tm-input" type="text" id="code" formControlName="code" autocomplete="one-time-code" inputmode="numeric" />
        </div>
    </div>

    <div class="tm-field">
        <label class="tm-label" for="new-password">Nueva contraseña</label>
        <div class="tm-input-wrap">
            <input class="tm-input" [type]="showPass() ? 'text' : 'password'" id="new-password" formControlName="password" autocomplete="new-password" />
            <button type="button" class="tm-input-action" [attr.aria-label]="showPass() ? 'Ocultar contraseña' : 'Mostrar contraseña'" (click)="showPass.set(!showPass())">
                <i class="pi" [class.pi-eye]="!showPass()" [class.pi-eye-slash]="showPass()"></i>
            </button>
        </div>
        @if (isValidField('password')) {
            <p class="tm-error">{{ getErrorMessage('password') }}</p>
        }
    </div>

    <div class="tm-field">
        <label class="tm-label" for="new-password2">Confirmar contraseña</label>
        <div class="tm-input-wrap">
            <input class="tm-input" [type]="showPass() ? 'text' : 'password'" id="new-password2" formControlName="confirmPassword" autocomplete="new-password" />
        </div>
        @if (resertPasswordForm.hasError('passwordsMismatch') && resertPasswordForm.controls.confirmPassword.touched) {
            <p class="tm-error">Las contraseñas no coinciden.</p>
        }
    </div>

    <button class="tm-btn tm-btn--primary tm-btn--lg tm-btn--block" type="submit">Guardar contraseña</button>
</form>
