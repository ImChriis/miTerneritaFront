<form class="content" [formGroup]="resertPasswordForm" (ngSubmit)="onSubmit()">
        <div class="inputGroup">
            <label for="email">Código</label>
            <input type="email" id="email" name="email" formControlName="code">
        </div>

        <div class="inputGroup">
            <label for="password">Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" formControlName="password" autocomplete="off">
                <button type="button" class="btn-Pass" (click)="showPassword()">
                <i class="pi pi-eye-slash"></i>
            </button>
            </div>
            <small *ngIf="isValidField('password')">{{ getErrorMessage('password') }}</small>
        </div>

        <div class="inputGroup">
            <label for="password">Confirmar Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="password2" name="password" formControlName="confirmPassword">
                <button type="button" class="btn-Pass2" (click)="showPassword2()">
                <i class="pi pi-eye-slash"></i>
            </button>
            </div>
            <small *ngIf="resertPasswordForm.hasError('passwordsMismatch') && resertPasswordForm.touched">
                    Las contraseñas no coinciden.
            </small>
        </div>

        <button class="btnLogin">Enviar</button>
</form>
