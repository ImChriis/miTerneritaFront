<div class="banner">
  <div class="bannerInfo">
    <div class="txt"></div>

    <div class="carousel" *ngIf="events$ | async as events">
      <div
        class="carousel-item"
        *ngFor="let event of events; let i = index"
        [class.active]="i === slideIndex()"
        [style.backgroundImage]="'url(' + apiImg + '/' + event.image3 + ')'"
      >
        <div class="carousel-content" *ngIf="i === slideIndex()">
          <h2>{{ event.name }}</h2>
            <div class="date2">
            <p>
              <i class="pi pi-calendar"></i> {{ event.date | date:'dd/MM/yyyy' }}
            </p>
            <p>
              <i class="pi pi-clock"></i> {{ event.time }}
            </p>
          </div>
          <button class="btn2" (click)="goToEvent(event.idEvents)">Ver más</button>
        </div>  
      </div>
      <button
        *ngIf="testEvents.length > 1"
        class="carousel-control prev"
        (click)="prevSlide()"
      >
        &#10094;
      </button>
      <button
        *ngIf="testEvents.length > 1"
        class="carousel-control next"
        (click)="nextSlide()"
      >
        &#10095;
      </button>
    </div>
  </div>
</div>

<div class="content" id="events-section">
  <div class="events"  #eventsGrid [style.background-image]="selectedBackground">
    <div class="title">
      <h1>Eventos</h1>
    </div>
     <div class="eventsCarousel" *ngIf="events$ | async as events">
        <div class="card" *ngFor="let event of events; let i = index" [class.active]="i === selectedIndex" (click)="selectEvent(i)">
        <img [src]='apiImg + "/" + event.flyer' [alt]="event.name">
        <div class="info">
          <h2>{{ event.name }}</h2>
          <div class="infoDate">
            <p>
              <i class="pi pi-calendar"></i> {{ event.date | date:'dd/MM/yyyy' }}
            </p>
            <p>
              <i class="pi pi-clock"></i> {{ event.time }}
            </p>
          </div>
          <a (click)="goToEvent(event.idEvents)">Ver más</a>
        </div>
        </div>
     </div>
  </div>
</div>
