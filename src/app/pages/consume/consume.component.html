@if (wallpaper()) {
    <div class="tm-page-backdrop" aria-hidden="true">
        <img src="{{ wallpaper() }}" alt="" />
    </div>
}

<div class="tm-container tm-flow">
    <header class="tm-flow-head">
        <div>
            <p class="tm-eyebrow">Consumo</p>
            <h1>{{ name() }}</h1>
            <p class="meta">Selecciona lo que vas a consumir.</p>
        </div>
    </header>

    <section class="tm-card tm-card--pad">
        <h2 class="title">Bebidas</h2>
        @if (drinks$ | async; as drinks) {
            <div class="grid">
                @for (drink of drinks; track drink.idDrinks) {
                    <article class="drink">
                        <img src="{{ apiImg + '/' + drink.image }}" [alt]="drink.description" loading="lazy" />
                        <div class="drink-info">
                            <h3>{{ drink.description }}</h3>
                            <strong>${{ drink.price | number: '1.2-2' }}</strong>
                        </div>
                        <button type="button" class="tm-btn tm-btn--soft tm-btn--sm tm-btn--block"><i class="pi pi-plus"></i> Agregar</button>
                    </article>
                }
            </div>
        }
    </section>

    <div class="actions">
        <a class="tm-btn tm-btn--primary tm-btn--lg" [routerLink]="['/home/event', idEvent, 'ticket', 'checkout']">Continuar <i class="pi pi-arrow-right"></i></a>
    </div>
</div>
