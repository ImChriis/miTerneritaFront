<form class="adm-form" [formGroup]="editUserForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="adm-grid">
        <div class="adm-field">
            <label for="eu-name">Nombre</label>
            <input pInputText id="eu-name" formControlName="name" />
        </div>

        <div class="adm-field">
            <label for="eu-last">Apellido</label>
            <input pInputText id="eu-last" formControlName="lastName" />
        </div>

        <div class="adm-field">
            <label for="eu-cedula">Cédula</label>
            <input pInputText id="eu-cedula" formControlName="cedula" placeholder="V-12345678" />
        </div>

        <div class="adm-field">
            <label for="eu-phone">Teléfono</label>
            <input pInputText id="eu-phone" type="tel" formControlName="phone" />
        </div>

        <div class="adm-field adm-full">
            <label for="eu-email">Correo electrónico</label>
            <input pInputText id="eu-email" type="email" formControlName="email" />
        </div>
    </div>

    <div class="adm-actions">
        <button type="button" class="adm-btn adm-btn--ghost" (click)="cerrar()">Cancelar</button>
        <button type="submit" class="adm-btn">Guardar cambios</button>
    </div>
</form>
