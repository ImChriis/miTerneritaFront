<body class="container">
  <div class="table">
    <div [class.blurred-background]="isModalOpen">
      @if (items$ | async; as items) {
        <div class="catalog-head">
          <div class="title">
            <h1>Eventos</h1>
            <p>Crea los eventos que se verán reflejados en la página</p>
          </div>
          <div class="buttons">
            @if (selectedEvents.length > 0) {
              <button pButton pRipple class="btn-delete" (click)="showConfirmModal()" aria-label="Eliminar seleccionados"><i class="pi pi-trash"></i></button>
            }
            <button class="btn" (click)="openCreateModal()">Agregar Evento</button>
          </div>
        </div>

        <app-catalogo-grid style="--photo-bg: #0d0d10"
          [items]="items"
          [seleccionados]="seleccion"
          (seleccion)="onSeleccion($event)"
          (editar)="openEditModal($event)"
          (eliminar)="showConfirmModal($event)"
        />
      } @else {
        <app-loader [isLoading]="isLoading()"></app-loader>
      }
    </div>
  </div>
</body>
