<body class="container">
    <div  [class.blurred-background]="isModalOpen">
      <!-- @if(
        zones$ | async
        ; as state) { -->

        <div class="title">
          <h1>Zonas</h1>
        </div>

        <p-table
          #dt1
          
          dataKey="id"
          [rows]="10"
          [showCurrentPageReport]="true"
          [rowsPerPageOptions]="[10, 25, 50]"
          [paginator]="true"
          currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} entradas"
          [globalFilterFields]="['Nombre', 'Apellido', 'Piso', 'Titulo', 'Estatus']"
          styleClass="ml-3 mr-3"
          >
          <ng-template pTemplate="caption">
            <div class="flex-row">
              <div class="p-toolbar-group-end">
                <span class="p-input-icon-left ml-auto">
                  <i class=""></i>
                  <input
                    pInputText
                    type="text"
                    placeholder="Buscar"
                    />
                  </span>
                </div>
                <button
                  pButton
                  pRipple
                  class="btn"
                  icon=""
                  label="Agregar Bebida"
                  (click)="openCreateModal()"
                ></button>
              </div>
            </ng-template>
            <ng-template pTemplate="header">
              <tr>
                <th style="min-width: 10rem" class="border">
                  <div class="flex thstyles">ID</div>
                </th>
                <th style="min-width: 10rem">
                  <div class="flex thstyles">Nombre</div>
                </th>
                <th style="min-width: 10rem">
                  <div class="flex thstyles">Cantidad de asientos</div>
                </th>
                <th style="min-width: 10rem">
                  <div class="flex thstyles">Evento</div>
                </th>
                <th style="min-width: 10rem">
                  <div class="flex thstyles">Lugar</div>
                </th>
                <th style="min-width: 10rem">
                  <div class="flex thstyles">Precio</div>
                </th>
                <th style="min-width: 10rem">
                  <div class="flex thstyles">Estado</div>
                </th>
                <th class="text-center" style="min-width: 10rem" class="border2">
                  <div class="flex thstyles option">Opciones</div>
                </th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-zone class="p-table">
              <tr class="table-content">
                <td class="column-table-left mr-5">
                  {{ zone.idZona }}
                </td>
                <td>
                  {{ zone.descripcion }}
                </td>
                <td>
                  {{ zone.sillas }}
                </td>
                <td>
                  <!-- {{ getPlaceName(zone.idLugar) }} -->
                </td>
                <td>
                  <!-- {{ getEventName(zone.idEvento) }} -->
                </td>
                <td>
                  {{ zone.precio }} Bs
                </td>
                <td>
                  <!-- @if (zone.status == zoneStatus.activo) {
                    <p-badge severity="success" [value]="zone.status"></p-badge>
                  }  @else {
                    <p-badge severity="danger" [value]="zone.status"></p-badge>
                  } -->
                </td>
                <td class="text-center column-table-right">
                  <div class="option">
                    <i class="pi pi-pencil btnEdit" ></i>
                    <i class="pi pi-times btnDelete" ></i>
                  </div>
                </td>
              </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
              <tr>
                <td colspan="7">No elementos encontrados.</td>
              </tr>
            </ng-template>
          </p-table>
        <!-- } -->
      </div>
    </body>
